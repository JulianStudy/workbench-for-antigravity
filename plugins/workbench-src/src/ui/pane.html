<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1f1f1f);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        border: 1px solid var(--color-border-primary, #dcdcdc);
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--color-background-secondary, #f7f8fa);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge-not_run {
        background: var(--color-background-tertiary, #eceef1);
        color: var(--color-text-secondary, #555555);
        border-color: var(--color-border-secondary, #d0d5dd);
      }
      .badge-passed {
        background: var(--color-background-success, rgba(46, 125, 50, 0.14));
        color: var(--color-text-success, #2e7d32);
        border-color: var(--color-border-success, rgba(46, 125, 50, 0.35));
      }
      .badge-failed,
      .badge-error {
        background: var(--color-background-danger, rgba(198, 40, 40, 0.14));
        color: var(--color-text-danger, #c62828);
        border-color: var(--color-border-danger, rgba(198, 40, 40, 0.35));
      }
      .badge-stale {
        background: var(--color-background-warning, rgba(237, 108, 2, 0.14));
        color: var(--color-text-warning, #b25e09);
        border-color: var(--color-border-warning, rgba(237, 108, 2, 0.38));
      }
      .criterion {
        margin: 8px 0 6px 0;
        font-size: 14px;
        font-weight: 600;
      }
      .kv {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 4px 8px;
        margin-top: 6px;
        font-size: 12px;
      }
      .kv-key {
        color: var(--color-text-secondary, #666666);
      }
      .kv-val {
        word-break: break-all;
      }
      .mono {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 12px;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--color-border-primary, #bdbdbd);
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1f1f1f);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        background: var(--color-background-inverse, #1f1f1f);
        color: var(--color-text-inverse, #ffffff);
        border-color: var(--color-border-inverse, #1f1f1f);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .hint {
        font-size: 11px;
        color: var(--color-text-tertiary, #777777);
      }
      .section-title {
        margin: 0 0 8px 0;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .notice {
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .notice-warning {
        background: var(--color-background-warning, rgba(237, 108, 2, 0.12));
        color: var(--color-text-warning, #b25e09);
        border: 1px solid var(--color-border-warning, rgba(237, 108, 2, 0.35));
      }
      .notice-danger {
        background: var(--color-background-danger, rgba(198, 40, 40, 0.12));
        color: var(--color-text-danger, #c62828);
        border: 1px solid var(--color-border-danger, rgba(198, 40, 40, 0.35));
      }
      .file-list {
        margin: 6px 0 0 0;
        padding-left: 18px;
      }
      .file-list li {
        margin: 2px 0;
      }
      pre.output {
        margin: 0;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--color-border-secondary, #e0e0e0);
        background: var(--color-background-primary, #ffffff);
        max-height: 280px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <section class="card">
        <div class="header">
          <h1 class="title">Workbench 验收检查</h1>
          <span id="state-badge" class="badge badge-not_run">连接中</span>
        </div>
        <div id="criterion-text" class="criterion">1250 分显示为 ¥12.50</div>
        <div class="kv">
          <div class="kv-key">检查目录</div>
          <div id="project-root" class="kv-val mono">加载中...</div>
          <div class="kv-key">检查命令</div>
          <div id="check-command" class="kv-val mono">-</div>
          <div class="kv-key">运行时</div>
          <div id="runtime-info" class="kv-val mono">-</div>
        </div>
        <div class="actions">
          <button id="run-btn" class="primary" type="button" disabled>运行检查</button>
          <button id="refresh-btn" type="button" disabled>手动刷新</button>
          <span id="poll-hint" class="hint">每 2 秒自动检测文件变化</span>
        </div>
      </section>

      <div id="error-banner" class="notice notice-danger hidden"></div>

      <section class="card">
        <div class="section-title">
          <span>上次检查证据</span>
          <span id="validity-badge" class="badge badge-not_run">暂无记录</span>
        </div>

        <div id="stale-box" class="notice notice-warning hidden">
          <div id="stale-reason-text"></div>
          <ul id="changed-files-list" class="file-list mono"></ul>
        </div>

        <div id="evidence-kv" class="kv">
          <div class="kv-key">已保存结果</div>
          <div id="saved-status" class="kv-val">-</div>
          <div class="kv-key">当前有效性</div>
          <div id="validity-text" class="kv-val">-</div>
          <div class="kv-key">退出码</div>
          <div id="exit-code" class="kv-val mono">-</div>
          <div class="kv-key">检查时间</div>
          <div id="checked-at" class="kv-val mono">-</div>
          <div class="kv-key">耗时</div>
          <div id="duration-ms" class="kv-val mono">-</div>
          <div class="kv-key">记录目录</div>
          <div id="recorded-root" class="kv-val mono">-</div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <span>检查输出</span>
          <span id="output-meta" class="hint"></span>
        </div>
        <pre id="check-output" class="output mono">尚未运行检查</pre>
      </section>
    </div>
    <!-- WORKBENCH_INLINE_SCRIPT -->
  </body>
</html>
