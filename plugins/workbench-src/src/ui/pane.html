<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1f1f1f);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        border: 1px solid var(--color-border-primary, #dcdcdc);
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--color-background-secondary, #f7f8fa);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .counts-summary {
        margin-top: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--color-text-primary, #1f1f1f);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge-not_run {
        background: var(--color-background-tertiary, #eceef1);
        color: var(--color-text-secondary, #555555);
        border-color: var(--color-border-secondary, #d0d5dd);
      }
      .badge-passed {
        background: var(--color-background-success, rgba(46, 125, 50, 0.14));
        color: var(--color-text-success, #2e7d32);
        border-color: var(--color-border-success, rgba(46, 125, 50, 0.35));
      }
      .badge-failed,
      .badge-error {
        background: var(--color-background-danger, rgba(198, 40, 40, 0.14));
        color: var(--color-text-danger, #c62828);
        border-color: var(--color-border-danger, rgba(198, 40, 40, 0.35));
      }
      .badge-stale,
      .badge-running {
        background: var(--color-background-warning, rgba(237, 108, 2, 0.14));
        color: var(--color-text-warning, #b25e09);
        border-color: var(--color-border-warning, rgba(237, 108, 2, 0.38));
      }
      .kv {
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 4px 8px;
        margin-top: 8px;
        font-size: 12px;
      }
      .kv-key {
        color: var(--color-text-secondary, #666666);
      }
      .kv-val {
        word-break: break-all;
      }
      .mono {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 12px;
      }
      .actions {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      button {
        padding: 5px 11px;
        border-radius: 6px;
        border: 1px solid var(--color-border-primary, #bdbdbd);
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1f1f1f);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        background: var(--color-background-inverse, #1f1f1f);
        color: var(--color-text-inverse, #ffffff);
        border-color: var(--color-border-inverse, #1f1f1f);
      }
      button.small {
        padding: 3px 9px;
        font-size: 12px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .hint {
        font-size: 11px;
        color: var(--color-text-tertiary, #777777);
      }
      .notice {
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
      }
      .notice-info {
        background: var(--color-background-tertiary, rgba(25, 118, 210, 0.1));
        color: var(--color-text-primary, #1f1f1f);
        border: 1px solid var(--color-border-primary, #c5d4e8);
      }
      .notice-warning {
        background: var(--color-background-warning, rgba(237, 108, 2, 0.12));
        color: var(--color-text-warning, #b25e09);
        border: 1px solid var(--color-border-warning, rgba(237, 108, 2, 0.35));
      }
      .notice-danger {
        background: var(--color-background-danger, rgba(198, 40, 40, 0.12));
        color: var(--color-text-danger, #c62828);
        border: 1px solid var(--color-border-danger, rgba(198, 40, 40, 0.35));
      }
      .checks-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .check-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .check-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .check-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .check-name {
        font-size: 14px;
        font-weight: 600;
        word-break: break-word;
      }
      .check-id {
        font-size: 11px;
        color: var(--color-text-secondary, #666666);
      }
      .check-cmd {
        padding: 5px 8px;
        border-radius: 5px;
        border: 1px solid var(--color-border-secondary, #e0e0e0);
        background: var(--color-background-primary, #ffffff);
        word-break: break-all;
      }
      .check-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .file-list {
        margin: 4px 0 0 0;
        padding-left: 18px;
      }
      .file-list li {
        margin: 2px 0;
      }
      .output-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .output-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--color-text-secondary, #666666);
      }
      pre.output {
        margin: 0;
        padding: 9px 10px;
        border-radius: 6px;
        border: 1px solid var(--color-border-secondary, #e0e0e0);
        background: var(--color-background-primary, #ffffff);
        max-height: 240px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .empty-state {
        text-align: center;
        padding: 18px 12px;
        color: var(--color-text-secondary, #666666);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <section class="card">
        <div class="header">
          <h1 class="title">Workbench 验收清单</h1>
          <span id="overall-badge" class="badge badge-not_run">连接中</span>
        </div>
        <div id="counts-summary" class="counts-summary">加载配置中...</div>
        <div class="kv">
          <div class="kv-key">检查目录</div>
          <div id="project-root" class="kv-val mono">加载中...</div>
          <div class="kv-key">运行时</div>
          <div id="runtime-info" class="kv-val mono">-</div>
        </div>
        <div class="actions">
          <button id="run-all-btn" class="primary" type="button" disabled>全部运行</button>
          <button id="refresh-btn" type="button" disabled>手动刷新</button>
          <span id="poll-hint" class="hint">每 2 秒自动检测文件变化</span>
        </div>
      </section>

      <div id="progress-banner" class="notice notice-info hidden"></div>
      <div id="error-banner" class="notice notice-danger hidden"></div>
      <div id="skipped-banner" class="notice notice-warning hidden"></div>

      <div id="checks-list" class="checks-list"></div>
    </div>
    <!-- WORKBENCH_INLINE_SCRIPT -->
  </body>
</html>
