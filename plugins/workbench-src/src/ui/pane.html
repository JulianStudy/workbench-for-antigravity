<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: 13px;
        line-height: 1.5;
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1f1f1f);
      }
      .card {
        border: 1px solid var(--color-border-primary, #dcdcdc);
        border-radius: 8px;
        padding: 14px;
        background: var(--color-background-secondary, #f8f9fa);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }
      .meta {
        margin: 6px 0;
        word-break: break-all;
      }
      .label {
        font-weight: 600;
        color: var(--color-text-secondary, #555555);
      }
      .mono {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 12px;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--color-border-primary, #bdbdbd);
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1f1f1f);
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .result {
        margin-top: 12px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--color-border-secondary, #e0e0e0);
        background: var(--color-background-primary, #ffffff);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error {
        color: var(--color-text-danger, #c62828);
      }
      .ok {
        color: var(--color-text-success, #2e7d32);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Workbench 连通性验证（阶段 1）</h1>
      <div class="meta">
        <span class="label">当前检查目录：</span>
        <span id="project-root" class="mono">连接中...</span>
      </div>
      <div class="meta">
        <span class="label">服务端 Node 版本：</span>
        <span id="node-version" class="mono">-</span>
      </div>
      <div class="meta">
        <span class="label">服务端可执行路径：</span>
        <span id="exec-path" class="mono">-</span>
      </div>
      <div class="actions">
        <button id="ping-btn" type="button" disabled>测试连接</button>
        <span id="conn-status" class="mono">初始化 MCP App...</span>
      </div>
      <div id="ping-output" class="result mono">尚未点击「测试连接」</div>
    </div>
    <!-- WORKBENCH_INLINE_SCRIPT -->
  </body>
</html>
